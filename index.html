<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Flower Garden & Dress-Up Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Poppins', sans-serif; user-select: none; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
    .interactive { pointer-events: auto; }
    .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
  </style>
  
  <!-- CDN Three.js versi r128 & OrbitControls yang kompatibel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body class="bg-slate-900">

  <!-- Kanvas 3D -->
  <div id="canvas-container"></div>

  <!-- UI Antarmuka 2D -->
  <div class="ui-layer flex flex-col justify-between p-6">
    <div class="flex justify-between items-center">
      <div class="glass rounded-full px-6 py-3 flex items-center gap-4 shadow-lg">
        <div class="flex items-center gap-2">
          <i class="fa-solid font-bold text-yellow-500 fa-coins text-xl"></i>
          <span id="coins" class="font-bold text-gray-800 text-lg">150</span>
        </div>
        <div class="h-4 w-px bg-gray-300"></div>
        <div class="flex items-center gap-2">
          <i class="fa-solid text-emerald-500 fa-seedling text-xl"></i>
          <span class="font-bold text-gray-800 text-lg">Lv. 1 Berkebun</span>
        </div>
      </div>
      
      <button class="interactive glass px-5 py-3 rounded-full font-bold text-gray-700 hover:bg-white transition shadow-lg flex items-center gap-2">
        <i class="fa-solid fa-shirt text-purple-600"></i> Lemari Pakaian
      </button>
    </div>

    <div class="flex justify-center gap-4 mb-4">
      <button onclick="waterFlowers()" class="interactive bg-sky-500 hover:bg-sky-600 text-white font-bold px-6 py-3 rounded-full shadow-lg transition flex items-center gap-2">
        <i class="fa-solid fa-droplet"></i> Siram Semua Bunga
      </button>
      <button onclick="harvestFlowers()" class="interactive bg-amber-500 hover:bg-amber-600 text-white font-bold px-6 py-3 rounded-full shadow-lg transition flex items-center gap-2">
        <i class="fa-solid fa-basket-shopping"></i> Panen Bunga Mekar
      </button>
    </div>
  </div>

  <!-- Script Rendering 3D -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('canvas-container');

      // 1. Scene, Camera, Renderer
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xe0f2fe); // Langit biru muda
      scene.fog = new THREE.FogExp2(0xe0f2fe, 0.015);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 8, 15);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // 2. Controls
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.maxPolarAngle = Math.PI / 2 - 0.05; // Supaya tidak tembus bawah tanah

      // 3. Pencahayaan
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 20, 10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // 4. Tanah Taman (Ground)
      const groundGeo = new THREE.PlaneGeometry(50, 50);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x4ade80 }); // Hijau rumput
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // Grid pembantu tanah
      const grid = new THREE.GridHelper(50, 25, 0x15803d, 0x22c55e);
      grid.position.y = 0.01;
      scene.add(grid);

      // 5. Membuat Bunga-bunga 3D
      const flowers = [];
      const flowerColors = [0xef4444, 0xec4899, 0xa855f7, 0x3b82f6, 0xeab308];

      function createFlower(x, z) {
        const group = new THREE.Group();

        // Tangkai
        const stemGeo = new THREE.CylinderGeometry(0.08, 0.08, 1.5);
        const stemMat = new THREE.MeshStandardMaterial({ color: 0x15803d });
        const stem = new THREE.Mesh(stemGeo, stemMat);
        stem.position.y = 0.75;
        stem.castShadow = true;
        group.add(stem);

        // Kelopak Bunga
        const color = flowerColors[Math.floor(Math.random() * flowerColors.length)];
        const petalMat = new THREE.MeshStandardMaterial({ color: color });
        
        for (let i = 0; i < 6; i++) {
          const petalGeo = new THREE.SphereGeometry(0.3, 16, 16);
          petalGeo.scale(1, 0.3, 1.8);
          const petal = new THREE.Mesh(petalGeo, petalMat);
          petal.position.y = 1.5;
          petal.rotation.y = (i * Math.PI) / 3;
          petal.castShadow = true;
          group.add(petal);
        }

        // Putik Tengah
        const centerGeo = new THREE.SphereGeometry(0.25, 16, 16);
        const centerMat = new THREE.MeshStandardMaterial({ color: 0xfde047 });
        const center = new THREE.Mesh(centerGeo, centerMat);
        center.position.y = 1.5;
        group.add(center);

        group.position.set(x, 0, z);
        scene.add(group);
        flowers.push(group);
      }

      // Tanam beberapa bunga secara otomatis
      for (let i = -6; i <= 6; i += 3) {
        for (let j = -6; j <= 6; j += 3) {
          createFlower(i, j);
        }
      }

      // 6. Animasi Loop
      function animate() {
        requestAnimationFrame(animate);
        controls.update();

        // Animasi bunga berayun tertiup angin
        const time = Date.now() * 0.002;
        flowers.forEach((f, idx) => {
          f.rotation.z = Math.sin(time + idx) * 0.05;
        });

        renderer.render(scene, camera);
      }
      animate();

      // Responsif Layar
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Fitur Tombol Interaktif
      window.waterFlowers = () => {
        flowers.forEach(f => {
          f.scale.set(1.2, 1.2, 1.2);
          setTimeout(() => f.scale.set(1, 1, 1), 300);
        });
      };

      window.harvestFlowers = () => {
        const coinsEl = document.getElementById('coins');
        let current = parseInt(coinsEl.innerText);
        coinsEl.innerText = current + 50;
      };
    });
  </script>
</body>
</html>
