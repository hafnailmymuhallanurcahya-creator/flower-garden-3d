<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Flower Garden & Dress-Up Game</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Poppins', sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.4); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #f472b6; border-radius: 10px; }
    </style>
</head>
<body class="bg-pink-50">

    <!-- Canvas Three.js -->
    <div id="canvas-container"></div>

    <!-- UI Layer -->
    <div class="relative z-10 flex flex-col justify-between h-screen p-4 pointer-events-none">
        
        <!-- Header / Stats -->
        <div class="flex justify-between items-center pointer-events-auto">
            <div class="glass rounded-full px-6 py-3 shadow-lg flex items-center space-x-4 border-2 border-pink-200">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-coins text-yellow-500 text-2xl"></i>
                    <span id="coins" class="font-bold text-gray-800 text-xl">150</span>
                </div>
                <div class="h-6 w-px bg-pink-300"></div>
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-seedling text-emerald-500 text-2xl"></i>
                    <span id="gardening-level" class="font-bold text-gray-800 text-xl">Lv. 1 Berkebun</span>
                </div>
            </div>

            <!-- Toggle Menus -->
            <div class="flex space-x-3">
                <button onclick="togglePanel('wardrobe-panel')" class="glass hover:bg-pink-100 text-pink-600 font-bold px-5 py-3 rounded-2xl shadow-md transition transform hover:scale-105 flex items-center space-x-2 border-2 border-pink-300">
                    <i class="fa-solid fa-shirt text-xl"></i>
                    <span>Lemari Pakaian (50 Skin)</span>
                </button>
                <button onclick="togglePanel('garden-panel')" class="glass hover:bg-emerald-100 text-emerald-600 font-bold px-5 py-3 rounded-2xl shadow-md transition transform hover:scale-105 flex items-center space-x-2 border-2 border-emerald-300">
                    <i class="fa-solid fa-spa text-xl"></i>
                    <span>Tanam Bunga</span>
                </button>
            </div>
        </div>

        <!-- Notification Toast -->
        <div id="toast" class="self-center glass px-6 py-3 rounded-full text-pink-700 font-semibold shadow-lg hidden transition-all border border-pink-300">
            Pesan Notifikasi
        </div>

        <!-- Sidebar Panel: Lemari Pakaian / Dress-Up (50 Skins) -->
        <div id="wardrobe-panel" class="glass absolute top-20 right-4 w-96 max-h-[80vh] rounded-3xl p-5 shadow-2xl overflow-y-auto custom-scrollbar pointer-events-auto hidden border-2 border-pink-200">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-pink-700 flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Katalog 50 Skin Outfit
                </h2>
                <button onclick="togglePanel('wardrobe-panel')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <!-- Category Tabs -->
            <div class="grid grid-cols-5 gap-1 mb-4 bg-pink-100 p-1 rounded-xl text-xs font-semibold text-gray-600">
                <button onclick="filterSkins('all')" class="py-1.5 rounded-lg bg-white shadow text-pink-600">Semua</button>
                <button onclick="filterSkins('cottage')" class="py-1.5 rounded-lg hover:bg-white">Cottage</button>
                <button onclick="filterSkins('fairy')" class="py-1.5 rounded-lg hover:bg-white">Fairy</button>
                <button onclick="filterSkins('princess')" class="py-1.5 rounded-lg hover:bg-white">Princess</button>
                <button onclick="filterSkins('casual')" class="py-1.5 rounded-lg hover:bg-white">Casual</button>
            </div>

            <!-- Skin Grid (Populated dynamically via JS with 50 items) -->
            <div id="skin-grid" class="grid grid-cols-2 gap-3"></div>
        </div>

        <!-- Sidebar Panel: Toko & Kebun Bunga -->
        <div id="garden-panel" class="glass absolute top-20 right-4 w-96 max-h-[80vh] rounded-3xl p-5 shadow-2xl overflow-y-auto custom-scrollbar pointer-events-auto hidden border-2 border-emerald-200">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-emerald-700 flex items-center gap-2">
                    <i class="fa-solid fa-seedling"></i> Benih Bunga
                </h2>
                <button onclick="togglePanel('garden-panel')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="space-y-3" id="flower-list"></div>
        </div>

        <!-- Bottom Controls -->
        <div class="flex justify-center items-center space-x-4 pointer-events-auto mb-2">
            <button onclick="waterPlants()" class="bg-gradient-to-r from-blue-400 to-indigo-500 text-white px-6 py-3 rounded-full font-bold shadow-lg hover:opacity-90 transition flex items-center space-x-2">
                <i class="fa-solid fa-droplet text-lg"></i>
                <span>Siram Semua Bunga</span>
            </button>
            <button onclick="harvestPlants()" class="bg-gradient-to-r from-amber-400 to-orange-500 text-white px-6 py-3 rounded-full font-bold shadow-lg hover:opacity-90 transition flex items-center space-x-2">
                <i class="fa-solid fa-basket-shopping text-lg"></i>
                <span>Panen Bunga Mekar</span>
            </button>
        </div>
    </div>

    <!-- JavaScript Game Logic -->
    <script>
        // --- 1. GAME DATA & DATABASE SKIN (50 SKINS) ---
        let coins = 200;
        let selectedFlower = 'rose';
        let currentSkinId = 1;

        // Generate 50 Unique Skins Data
        const skins = [];
        const categories = ['cottage', 'fairy', 'princess', 'casual', 'floral'];
        const colorPalettes = [
            { dress: 0xffb6c1, accent: 0xff69b4, name: "Pink Blossom" },
            { dress: 0xe6e6fa, accent: 0x9370db, name: "Lavender Dream" },
            { dress: 0xfffacd, accent: 0xffd700, name: "Sunflower Gold" },
            { dress: 0xa8e6cf, accent: 0x3b7a57, name: "Mint Garden" },
            { dress: 0xffd3b6, accent: 0xff8b94, name: "Peach Tulip" },
            { dress: 0xd4f0f0, accent: 0x89cff0, name: "Ocean Breeze" },
            { dress: 0xfce1e4, accent: 0xda2c43, name: "Rose Ruby" },
            { dress: 0xe2f0cb, accent: 0xb5e7a0, name: "Fairy Sage" },
            { dress: 0xfff5ba, accent: 0xffb347, name: "Daisy Meadow" },
            { dress: 0xebf4f6, accent: 0x008080, name: "Crystal Lily" }
        ];

        for (let i = 1; i <= 50; i++) {
            const cat = categories[(i - 1) % categories.length];
            const palette = colorPalettes[(i - 1) % colorPalettes.length];
            skins.push({
                id: i,
                name: `${palette.name} #${Math.ceil(i/5)}`,
                category: cat,
                dressColor: palette.dress,
                accentColor: palette.accent,
                price: i === 1 ? 0 : i * 20,
                unlocked: i === 1
            });
        }

        const flowerTypes = [
            { id: 'rose', name: 'Mawar Merah', color: 0xe11d48, growthTime: 3, price: 10 },
            { id: 'tulip', name: 'Tulip Kuning', color: 0xeab308, growthTime: 4, price: 15 },
            { id: 'sunflower', name: 'Bunga Matahari', color: 0xf59e0b, growthTime: 5, price: 25 },
            { id: 'lavender', name: 'Lavender Ungu', color: 0x8b5cf6, growthTime: 3, price: 20 },
            { id: 'lily', name: 'Lily Putih', color: 0xf8fafc, growthTime: 6, price: 30 }
        ];

        // --- 2. THREE.JS 3D ENGINE INITIALIZATION ---
        let scene, camera, renderer, controls;
        let characterGroup, dressMesh, hatMesh, hairMesh;
        const gardenPlots = [];

        function init3D() {
            const container = document.getElementById('canvas-container');
            
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xe0f2fe); // Soft blue sky
            scene.fog = new THREE.FogExp2(0xe0f2fe, 0.015);

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 16);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Don't go below ground
            controls.minDistance = 5;
            controls.maxDistance = 25;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
            sunLight.position.set(10, 20, 10);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);

            // Ground / Grass Field
            const groundGeo = new THREE.PlaneGeometry(60, 60);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x86efac, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Create Character & Garden Plots
            create3DCharacter();
            createGardenPlots();
            createEnvironmentDecoration();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // --- 3. CHARACTER & DRESS-UP 3D BUILDER ---
        function create3DCharacter() {
            characterGroup = new THREE.Group();
            characterGroup.position.set(-4, 0, 0);

            // Skin Material
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.5 });
            
            // Head
            const headGeo = new THREE.SphereGeometry(0.6, 32, 32);
            const head = new THREE.Mesh(headGeo, skinMat);
            head.position.y = 2.8;
            head.castShadow = true;
            characterGroup.add(head);

            // Hair
            const hairGeo = new THREE.SphereGeometry(0.68, 16, 16);
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.9 });
            hairMesh = new THREE.Mesh(hairGeo, hairMat);
            hairMesh.position.set(0, 2.9, -0.1);
            hairMesh.scale.set(1, 1.1, 1);
            characterGroup.add(hairMesh);

            // Dress / Body
            const dressGeo = new THREE.CylinderGeometry(0.3, 0.9, 1.6, 32);
            const dressMat = new THREE.MeshStandardMaterial({ color: skins[0].dressColor, roughness: 0.3 });
            dressMesh = new THREE.Mesh(dressGeo, dressMat);
            dressMesh.position.y = 1.6;
            dressMesh.castShadow = true;
            characterGroup.add(dressMesh);

            // Flower Crown / Hat
            const hatGeo = new THREE.TorusGeometry(0.65, 0.08, 16, 32);
            const hatMat = new THREE.MeshStandardMaterial({ color: skins[0].accentColor });
            hatMesh = new THREE.Mesh(hatGeo, hatMat);
            hatMesh.rotation.x = Math.PI / 2;
            hatMesh.position.y = 3.3;
            characterGroup.add(hatMesh);

            scene.add(characterGroup);
        }

        function updateCharacterSkin(skin) {
            dressMesh.material.color.setHex(skin.dressColor);
            hatMesh.material.color.setHex(skin.accentColor);
            
            // Floating Sparkle Animation on Dress Change
            showToast(`Skin diganti ke: ${skin.name}`);
        }

        // --- 4. GARDEN PLOTS & PLANTING SYSTEM ---
        function createGardenPlots() {
            const plotGeo = new THREE.BoxGeometry(2, 0.2, 2);
            const soilMat = new THREE.MeshStandardMaterial({ color: 0x5c3d2e, roughness: 0.9 });

            let index = 0;
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 3; col++) {
                    const plot = new THREE.Mesh(plotGeo, soilMat);
                    const posX = col * 2.8 + 1;
                    const posZ = row * 2.8 - 2.8;
                    plot.position.set(posX, 0.1, posZ);
                    plot.receiveShadow = true;
                    scene.add(plot);

                    gardenPlots.push({
                        mesh: plot,
                        id: index++,
                        flowerMesh: null,
                        stage: 0, // 0: Kosong, 1: Tunas, 2: Mekar
                        type: null
                    });
                }
            }
        }

        function plantFlowerInPlot(plot) {
            if (plot.stage !== 0) return;

            const flowerData = flowerTypes.find(f => f.id === selectedFlower);
            if (coins < flowerData.price) {
                showToast("Koin tidak cukup untuk membeli benih!");
                return;
            }

            coins -= flowerData.price;
            updateUI();

            // Create Sprout 3D
            const stemGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.8);
            const stemMat = new THREE.MeshStandardMaterial({ color: 0x22c55e });
            const stem = new THREE.Mesh(stemGeo, stemMat);
            
            const petalGeo = new THREE.DodecahedronGeometry(0.3);
            const petalMat = new THREE.MeshStandardMaterial({ color: flowerData.color });
            const petals = new THREE.Mesh(petalGeo, petalMat);
            petals.position.y = 0.5;

            const flowerGroup = new THREE.Group();
            flowerGroup.add(stem);
            flowerGroup.add(petals);
            flowerGroup.position.set(plot.mesh.position.x, 0.5, plot.mesh.position.z);
            flowerGroup.scale.set(0.3, 0.3, 0.3); // Tunas kecil

            scene.add(flowerGroup);
            plot.flowerMesh = flowerGroup;
            plot.stage = 1;
            plot.type = flowerData;

            showToast(`Berhasil menanam ${flowerData.name}!`);
        }

        function waterPlants() {
            let watered = false;
            gardenPlots.forEach(plot => {
                if (plot.stage === 1) {
                    plot.stage = 2;
                    // Animasi Tumbuh Mekar
                    plot.flowerMesh.scale.set(1, 1, 1);
                    plot.flowerMesh.position.y = 0.6;
                    watered = true;
                }
            });

            if (watered) {
                showToast("Bunga telah disiram dan mekar indah! 🌸");
            } else {
                showToast("Tidak ada benih yang perlu disiram.");
            }
        }

        function harvestPlants() {
            let earned = 0;
            gardenPlots.forEach(plot => {
                if (plot.stage === 2) {
                    scene.remove(plot.flowerMesh);
                    plot.flowerMesh = null;
                    plot.stage = 0;
                    earned += plot.type.price * 2;
                }
            });

            if (earned > 0) {
                coins += earned;
                updateUI();
                showToast(`Memanen bunga dan mendapatkan +${earned} Koin! ✨`);
            } else {
                showToast("Belum ada bunga mekar yang siap dipanen.");
            }
        }

        function createEnvironmentDecoration() {
            // Add background trees
            for(let i=0; i<12; i++) {
                const trunkGeo = new THREE.CylinderGeometry(0.3, 0.4, 2);
                const trunkMat = new THREE.MeshStandardMaterial({color: 0x8b5a2b});
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);

                const leavesGeo = new THREE.ConeGeometry(1.5, 3, 8);
                const leavesMat = new THREE.MeshStandardMaterial({color: 0x4ade80});
                const leaves = new THREE.Mesh(leavesGeo, leavesMat);
                leaves.position.y = 2;

                const tree = new THREE.Group();
                tree.add(trunk);
                tree.add(leaves);

                const angle = (i / 12) * Math.PI * 2;
                tree.position.set(Math.cos(angle)*18, 1, Math.sin(angle)*18);
                scene.add(tree);
            }
        }

        // --- 5. RAYCASTING INTERACTION (CLICK PLOTS) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (e) => {
            // Ignore UI clicks
            if (e.target.tagName !== 'CANVAS') return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(gardenPlots.map(p => p.mesh));

            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                const plot = gardenPlots.find(p => p.mesh === clickedMesh);
                if (plot) plantFlowerInPlot(plot);
            }
        });

        // --- 6. UI RENDER & CONTROLLERS ---
        function renderSkinGrid(filter = 'all') {
            const grid = document.getElementById('skin-grid');
            grid.innerHTML = '';

            const filteredSkins = filter === 'all' ? skins : skins.filter(s => s.category === filter);

            filteredSkins.forEach(skin => {
                const card = document.createElement('div');
                card.className = `p-3 rounded-2xl border flex flex-col items-center justify-between cursor-pointer transition transform hover:scale-105 ${
                    currentSkinId === skin.id ? 'border-pink-500 bg-pink-100 shadow-md' : 'border-gray-200 bg-white'
                }`;

                card.innerHTML = `
                    <div class="w-12 h-12 rounded-full mb-2 flex items-center justify-center shadow-inner" style="background: #${skin.dressColor.toString(16).padStart(6, '0')}">
                        <i class="fa-solid fa-shirt text-lg" style="color: #${skin.accentColor.toString(16).padStart(6, '0')}"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-700 text-center mb-1">${skin.name}</span>
                    ${
                        skin.unlocked 
                        ? `<button onclick="selectSkin(${skin.id})" class="w-full py-1 text-xs bg-pink-500 text-white rounded-lg font-semibold hover:bg-pink-600">${currentSkinId === skin
